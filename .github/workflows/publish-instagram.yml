name: Publish existing video to Instagram
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Existing R2 job to publish as a PUBLIC Reel (no generation)'
        required: true
        default: pilot-001
        type: string
permissions:
  contents: read
concurrency:
  group: content-factory-instagram
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install publishing dependencies
        run: python -m pip install 'boto3==1.40.45' 'requests==2.32.5'
      - name: Publish existing video as Reel
        env:
          JOB_ID: ${{ inputs.job_id }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: python publish_instagram.py
