name: Publish existing video to YouTube
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Existing R2 job to upload privately (no image generation)'
        required: true
        default: pilot-001
        type: string
permissions:
  contents: read
concurrency:
  group: content-factory-youtube
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install publishing dependencies
        run: python -m pip install 'boto3==1.40.45' 'requests==2.32.5'
      - name: Upload existing video privately
        env:
          JOB_ID: ${{ inputs.job_id }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          YOUTUBE_OAUTH_JSON: ${{ secrets.YOUTUBE_OAUTH_JSON }}
        run: python publish_youtube.py
