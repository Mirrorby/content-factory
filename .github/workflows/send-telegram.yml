name: Send existing video to Telegram
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Existing R2 job to send to your private Telegram chat'
        required: true
        default: pilot-001
        type: string
permissions:
  contents: read
concurrency:
  group: content-factory-telegram
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install publishing dependencies
        run: python -m pip install 'boto3==1.40.45' 'requests==2.32.5'
      - name: Send video to private Telegram chat
        env:
          JOB_ID: ${{ inputs.job_id }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python send_telegram.py
